# Claude headless plans and reviews; Codex on two accounts implements, in fallback order.
# Start from it with: agent-bridge config-init orchestrator. Validate with: agent-bridge config-check
#
# Role != agent != provider != account != model:
#   accounts  - isolated logins (one auth home each), with a concurrency limit
#   agents    - an adapter (CLI) bound to one account, an optional model and capabilities
#   roles     - which agents play planner / executor / reviewer, in fallback order
#   workflow  - the stages every task goes through
version: 1

accounts:
  codex-work:
    provider: openai
    home: ~/.codex-accounts/homes/work   # a human runs: agent-bridge account-login codex-work
  codex-personal:
    provider: openai
    home: ~/.codex-accounts/homes/personal
  claude-main:
    provider: anthropic
    home: ~/.claude-accounts/main        # a human runs: agent-bridge account-login claude-main
    max_concurrency: 1

agents:
  claude:                 # the Claude Code session driving this bridge over MCP
    adapter: client
  claude-headless:        # Claude Code started by the bridge (claude -p), read-only
    adapter: claude-cli
    account: claude-main
    model: sonnet
  codex-a:
    adapter: codex-cli
    account: codex-work
  codex-b:
    adapter: codex-cli
    account: codex-personal

roles:
  planner: claude-headless
  executor:
    agents: [codex-a, codex-b]   # first eligible wins; codex-b takes over when codex-a is busy
    strategy: ordered
  reviewer: claude-headless      # or `claude`: review yourself through bridge_review_task

routing:
  quota_fallback:
    enabled: false               # true authorises moving work to the next executor on low quota
    min_remaining_pct: 10

workflow:
  stages: [plan, execute, test, review]
  max_rework: 2
