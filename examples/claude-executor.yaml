# Codex plans and reviews; Claude Code implements. Claude has no OS sandbox, so writing is
# opt-in (allow_write) and limited to the Read/Glob/Grep/Edit/Write tools; Bash stays off unless
# allow_bash is set. The bridge still checks every changed path after the run.
version: 1
accounts:
  codex-work: {provider: openai, home: ~/.codex-accounts/homes/work}
  claude-main: {provider: anthropic, home: ~/.claude-accounts/main}
agents:
  codex: {adapter: codex-cli, account: codex-work}
  claude-writer: {adapter: claude-cli, account: claude-main, allow_write: true}
roles:
  planner: codex
  executor: claude-writer
  reviewer: codex
workflow:
  stages: [plan, execute, test, review]
