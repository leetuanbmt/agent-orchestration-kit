<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <strong id="brand"></strong>
    <nav id="views" class="pills" aria-label="Views"></nav>
    <span id="live" class="pill live" role="status"></span>
    <div id="languages" class="pills"></div>
  </header>
  <main id="content">
    <section id="tasks-view">
      <div class="filter-bar">
        <label><span id="search-label"></span><input id="search" type="search"></label>
        <label><span id="project-label"></span><select id="project"></select></label>
        <label><span id="worktree-label"></span><select id="worktree"></select></label>
        <button id="group-worktree" type="button" aria-pressed="false"></button>
        <button id="clear" type="button" hidden></button>
      </div>
      <div id="statuses" class="pills"></div>
      <p id="task-count"></p>
      <table aria-labelledby="task-count">
        <thead><tr id="columns"></tr></thead>
        <tbody id="task-rows"></tbody>
      </table>
      <div id="tasks-empty" class="empty" hidden><p id="empty-message"></p><button id="empty-clear" type="button"></button></div>
    </section>
    <section id="projects-view" hidden><div id="project-cards"></div><p id="projects-empty"></p></section>
  </main>
  <footer id="footer"></footer>
  <aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <button id="close" class="close" type="button"></button>
    <h2 id="drawer-title"></h2>
    <div id="drawer-body"></div>
  </aside>
</body>
</html>
