[project]
name = "agent-orchestration-kit"
version = "0.1.0"
description = "Project-local Claude (planner/reviewer) <-> Codex CLI (executor) MCP bridge"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0,<3",
    "pyyaml>=6.0,<7",
    "textual>=6,<9",
]

[project.urls]
Homepage = "https://github.com/leetuanbmt/agent-orchestration-kit"
Repository = "https://github.com/leetuanbmt/agent-orchestration-kit"
Changelog = "https://github.com/leetuanbmt/agent-orchestration-kit/blob/main/CHANGELOG.md"

[project.scripts]
agent-bridge = "bridge.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]

# `agent-bridge init` copies these into projects; a non-editable install has no checkout to
# read them from, so the wheel carries them under bridge/kit/ with the same layout.
[tool.hatch.build.targets.wheel.force-include]
".claude/rules/orchestration.md" = "bridge/kit/.claude/rules/orchestration.md"
".claude/rules/delegation.md" = "bridge/kit/.claude/rules/delegation.md"
".claude/rules/security.md" = "bridge/kit/.claude/rules/security.md"
".claude/skills/agent-orchestration" = "bridge/kit/.claude/skills/agent-orchestration"
".claude/settings.json" = "bridge/kit/.claude/settings.json"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Inside the repo: the Codex sandbox cannot write $TMPDIR (exclude_tmpdir_env_var).
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = ["real_codex: hits the real Codex CLI (opt-in via CODEX_SMOKE=1)"]
